<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1 class="header-text">Welcome to Tic Tac Toe game!</h1>
            <div class="form-container">
                <form action="#" method="get" class="player1-form">
                <div class="form-container">
                    <div class="input-wrapper player1-input-wrapper">
                        <label for="player1Input">Enter first player name:</label>
                        <input type="text" name="name" id="player1Input" placeholder="Enter first player name" class="input" required>
                    </div>
                    <div class="submit-btn-container">
                        <button type="submit" class="submit-btn" id="player1SubmitBtn">Submit name</button>
                        <button type="button" class="reset-name-btn" id="player1ResetNameBtn">Reset Name</button>
                    </div>
                </div>
                </form>
                <form action="#" method="get" class="player2-form">
                    <div class="form-container">
                        <div class="input-wrapper player2-input-wrapper">
                            <label for="player2Input">Enter second player name:</label>
                            <input type="text" name="name" id="player2Input" placeholder="Enter second player name" class="input" required>
                        </div>
                        <div class="submit-btn-container">
                            <button type="submit" class="submit-btn" id="player2SubmitBtn">Submit name</button>
                            <button type="button" class="reset-name-btn" id="player2ResetNameBtn">Reset Name</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </header>
    <main>
        <div class="main-container">
            <button class="start-game-btn"></button>
            <div class="game-info">
                <span class="current-player"></span>
            </div>
            <div class="grid">
                <div class="game-cell top-cell" data-index="0"></div>
                <div class="game-cell top-cell" data-index="1"></div>
                <div class="game-cell top-cell" data-index="2"></div>
                <div class="game-cell middle-cell" data-index="3"></div>
                <div class="game-cell middle-cell" data-index="4"></div>
                <div class="game-cell middle-cell" data-index="5"></div>
                <div class="game-cell footer-cell" data-index="6"></div>
                <div class="game-cell footer-cell" data-index="7"></div>
                <div class="game-cell footer-cell" data-index="8"></div>
            </div>
            <button class="reset-game-btn">Reset Game</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
