<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1 class="header-text">Welcome to Tic Tac Toe game!</h1>
            <div class="form-container">
                <form action="#" method="get">
                    <div class="input-wrapper">
                        <label for="name">Enter your name:</label>
                        <input type="text" name="name" id="name" placeholder="Enter your name" class="input" required>
                    </div>
                    <div class="submit-btn-container">
                        <button type="submit" class="submit-btn">Submit name</button>
                        <button type="button" class="reset-name-btn">Reset Name</button>
                    </div>
                </form>
            </div>
        </div>
    </header>
    <main>
        <div class="main-container">
            <button class="start-game-btn"></button>
            <div class="game-info">
                <span class="player-name"></span>
                <span class=""></span>
            </div>
            <div class="grid">
                <div class="game-cell top-cell" data-index="0"></div>
                <div class="game-cell top-cell" data-index="1"></div>
                <div class="game-cell top-cell" data-index="2"></div>
                <div class="game-cell middle-cell" data-index="3"></div>
                <div class="game-cell middle-cell" data-index="4"></div>
                <div class="game-cell middle-cell" data-index="5"></div>
                <div class="game-cell footer-cell" data-index="6"></div>
                <div class="game-cell footer-cell" data-index="7"></div>
                <div class="game-cell footer-cell" data-index="8"></div>
            </div>
            <button class="reset-game-btn">Reset Game</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
